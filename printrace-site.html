<style>
  body { background: #0a0a0a; color: #fff; overflow: hidden; }
  /* Trait discret sous le mot du titre ; en lecture auto, il se remplit jusqu'au mot suivant */
  /* Site : chiffres dans la police du texte (le design system les met en Barlow condensé) */
  .font-site .tabular-nums, .font-site .font-mono { font-family: inherit; letter-spacing: inherit; word-spacing: normal; }
  .site-bar { height: max(3px, 0.04em); border-radius: 99px; }
  .site-bar-fill { width: 100%; border-radius: 99px; transform: scaleX(0); transform-origin: left; will-change: transform; animation: siteFill linear 1 forwards; }
  @keyframes siteFill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .site-bar-fill { animation: none; transform: none; opacity: .6; } }
  /* Banderole Instagram : défilement continu (transform seulement), pause au survol */
  .site-marquee-track { animation: siteMarquee 70s linear infinite; will-change: transform; }
  .site-marquee:hover .site-marquee-track { animation-play-state: paused; }
  @keyframes siteMarquee { to { transform: translateX(calc(-50% - 10px)); } }
  @media (prefers-reduced-motion: reduce) { .site-marquee { overflow-x: auto; } .site-marquee-track { animation: none; } }
  /* Mode édition : textes modifiables soulignés, modifiés en orange */
  .pt-editing [data-tx] { outline: 1px dashed rgba(96,165,250,0.55); outline-offset: 3px; border-radius: 2px; cursor: text; }
  .pt-editing [data-tx]:hover { outline: 2px solid #60a5fa; background: rgba(96,165,250,0.10); }
  .pt-editing [data-tx][data-tx-changed] { outline: 2px solid #f59e0b; }
</style>
