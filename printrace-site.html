<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Printrace</title>
<meta name="description" content="Imprimez votre trek : transformez votre tracé GPX, FIT ou Strava en poster vectoriel prêt à encadrer." />
<link rel="icon" href="assets/printrace-favicon.svg" type="image/svg+xml" />

<meta name="ext-resource-dependency" content="assets/strava.svg" data-resource-id="stravaLogo" />

<script>
  // Relais Strava (workers/strava) : vide = parcours guidé (export du GPX puis dépôt)
  window.PRINTRACE_CONFIG = { stravaApi: '' };
</script>

<link rel="stylesheet" href="ds.css" />
<script src="vendor/canvas2svg.js"></script>
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<style>
  body { background: #0a0a0a; color: #fff; overflow: hidden; }
  /* Trait discret sous le mot du titre ; en lecture auto, il se remplit jusqu'au mot suivant */
  .site-dash { border-radius: 99px; background-image: repeating-linear-gradient(90deg, var(--c) 0 0.16em, transparent 0.16em 0.22em); }
  .site-dash-fill { width: 0; animation: siteFill linear 1 forwards; }
  @keyframes siteFill { from { width: 0; } to { width: 100%; } }
  @media (prefers-reduced-motion: reduce) { .site-dash-fill { display: none; } }
</style>
<link rel="stylesheet" href="tailwind.css" />
</head>
<body>
<div id="root"></div>

<script src="js/gpx.js"></script>
<script type="text/babel" src="src/icons.jsx"></script>
<script type="text/babel" src="src/ds/ui.jsx"></script>
<script type="text/babel" src="src/data.jsx"></script>
<script type="text/babel" src="src/track-io.jsx"></script>
<script type="text/babel" src="src/share-link.jsx"></script>
<script type="text/babel" src="src/story-share.jsx"></script>
<script type="text/babel" src="src/poster-map.jsx"></script>
<script type="text/babel" src="src/poster-share.jsx"></script>
<script type="text/babel" src="src/printrace/library.jsx"></script>
<script type="text/babel" src="src/printrace/import.jsx"></script>
<script type="text/babel" src="src/site/landing.jsx"></script>
</body>
</html>
