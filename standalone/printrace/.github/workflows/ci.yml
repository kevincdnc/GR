# Vérification à chaque push : installation propre et build de production.
# Le déploiement est fait par Cloudflare Pages (connecté au dépôt), pas par cette action.
name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
