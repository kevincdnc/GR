<style>
  body { background: #0a0a0a; color: #fff; }
  /* Mosaïque : rangées qui défilent lentement, en sens alternés */
  @keyframes pt-row-l { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-50%, 0, 0); } }
  @keyframes pt-row-r { from { transform: translate3d(-50%, 0, 0); } to { transform: translate3d(0, 0, 0); } }
  .pt-row { animation: pt-row-l var(--d, 90s) linear infinite; will-change: transform; }
  .pt-row.rev { animation-name: pt-row-r; }
  @media (prefers-reduced-motion: reduce) { .pt-row { animation: none; } }
</style>
