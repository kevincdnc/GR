# Relais Strava de Printrace — déploiement : voir README.md
name = "printrace-strava"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
STRAVA_CLIENT_ID = ""                               # identifiant de l'application Strava
ALLOWED_ORIGINS = ""                                # origines du site Printrace autorisées, séparées par des virgules
                                                     # (ex. https://printrace.app,http://localhost:5173)

[[kv_namespaces]]
binding = "SESSIONS"
id = ""                                              # npx wrangler kv namespace create SESSIONS
